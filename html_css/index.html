<!-- Types of Tag

1) Anchor tag: used to add link 
  1) <a href="https://example.com" >Text to add</a> opens in the same tab 
  2) <a href="https://example.com" target="_main"></a> opens it in a new tab.
  3) we can also give a image in Anchor tag, <a href="link.."><img src="img-link.." alt="Text"/></a> 

2) Image Tag: used to add Image link.
<img src="image link" alt="alternative text"></img>

3) Big and Small tag 
for displaying text in small and large font.

<big>Text</big>
<small>Text</small>

4) Horizontal Divider:
<hr></hr>

for eg: 

<h1>Text 1</h1> 
<hr></hr>
<h1>Text 2</h1>

5) Pre Tag:

It is used to show Text as it is written.

<pre> I am 
  Ironman
</pre>

5) Semantic Tags: which forms the modern layout of the webpage 

1) Header: The Topmost tag in the webpage which mostly contains the navbar for navigation
2) Footer: The bottommost tag in the webpage which contains the contact information
3) Main: This tag is used to show the main content on the webpage.

  Tags in Main tag:
  1) Section Tag: To divide the webpage into multiple sections.
  2) Article Tag: To show a article or post or a independent content on the webpage.
  3) Aside Tag: To show the ads which are not a part of our webpage and we donot want google 

Inline vs Block elements:
  Block element: which takes complete width of the screen.
  Inline element: which takes only that much space which is required.

  Div Tag: div is a container for other elements, like other elements can be placed under div tag.
  div Tag is a Block element.

  Span Tag :Similar to div span is also a container element and it is inline element.
